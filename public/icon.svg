<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="congoGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="congoYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="congoRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#4F46E5" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Tri-color Republic of Congo Top Arc Accent -->
  <path d="M120 70 Q 256 40 392 70" stroke="url(#congoGreen)" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M140 85 Q 256 58 372 85" stroke="url(#congoYellow)" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M160 100 Q 256 76 352 100" stroke="url(#congoRed)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Main School Building & Book Shield Emblem -->
  <g filter="url(#glow)" transform="translate(0, 10)">
    <!-- Graduation Cap / Roof -->
    <path d="M256 140 L390 200 L256 260 L122 200 Z" fill="url(#indigoGrad)"/>
    <path d="M256 140 L390 200 L256 260 L122 200 Z" fill="none" stroke="#C7D2FE" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Tassel -->
    <path d="M370 205 L370 270 Q 370 280 380 285" fill="none" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
    <circle cx="380" cy="290" r="8" fill="#FBBF24"/>

    <!-- Open Book Base -->
    <path d="M140 260 C 180 250, 240 265, 256 280 C 272 265, 332 250, 372 260 L 372 380 C 332 370, 272 385, 256 400 C 240 385, 180 370, 140 380 Z" fill="#FFFFFF"/>
    <path d="M140 260 C 180 250, 240 265, 256 280 C 272 265, 332 250, 372 260 L 372 380 C 332 370, 272 385, 256 400 C 240 385, 180 370, 140 380 Z" fill="none" stroke="#CBD5E1" stroke-width="4"/>

    <!-- Book Spine Divider -->
    <line x1="256" y1="280" x2="256" y2="400" stroke="#4F46E5" stroke-width="6" stroke-linecap="round"/>

    <!-- Book Lines Left -->
    <line x1="165" y1="290" x2="235" y2="305" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <line x1="165" y1="315" x2="235" y2="330" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <line x1="165" y1="340" x2="235" y2="355" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>

    <!-- Book Lines Right -->
    <line x1="277" y1="305" x2="347" y2="290" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <line x1="277" y1="330" x2="347" y2="315" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <line x1="277" y1="355" x2="347" y2="340" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Offline-First Sync Badge Symbol at Bottom -->
  <g transform="translate(256, 442)">
    <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#10B981"/>
    <text x="0" y="6" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="1.5">OFFLINE-FIRST</text>
  </g>
</svg>
